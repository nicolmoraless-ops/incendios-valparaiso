# Balanceador de carga + servidor del frontend (entorno Docker Compose / VM).
worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    server_tokens off;
    sendfile on;
    gzip on;
    gzip_types application/json text/css application/javascript;

    log_format json escape=json '{"ts":"$time_iso8601","ip":"$remote_addr","metodo":"$request_method",'
                                '"uri":"$request_uri","status":$status,"rt":$request_time,'
                                '"upstream":"$upstream_addr","urt":"$upstream_response_time","rid":"$request_id"}';
    access_log /var/log/nginx/access.log json;

    # Control de abuso: límite de tasa por IP
    limit_req_zone $binary_remote_addr zone=api:10m   rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_status 429;

    upstream api_backend {
        least_conn;                                   # menos conexiones activas
        server api-1:8000 max_fails=3 fail_timeout=10s;  # health check pasivo
        server api-2:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        root /usr/share/nginx/html;

        location = /nginx-health { access_log off; default_type text/plain; return 200 "ok\n"; }

        location / {
            include /etc/nginx/security-headers.conf;
            try_files $uri /index.html;
        }

        location = /api/v1/auth/login {
            include /etc/nginx/security-headers.conf;
            limit_req zone=login burst=5 nodelay;
            include /etc/nginx/proxy-api.conf;
        }

        location /api/ {
            include /etc/nginx/security-headers.conf;
            limit_req zone=api burst=60 nodelay;
            include /etc/nginx/proxy-api.conf;
        }
    }
}
