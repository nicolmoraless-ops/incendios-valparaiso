global:
  scrape_interval: 10s
  evaluation_interval: 15s

rule_files: [/etc/prometheus/alertas.yml]

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api-1:8000", "api-2:8000"]
  - job_name: ia
    static_configs:
      - targets: ["ia:8001"]
  - job_name: worker
    static_configs:
      - targets: ["worker:9101"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
