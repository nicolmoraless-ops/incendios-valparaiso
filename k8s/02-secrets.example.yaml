# PLANTILLA. Copiar a 02-secrets.yaml (ignorado por git) y reemplazar valores.
# En AWS (EKS) estos valores se sincronizan desde AWS Secrets Manager con External Secrets Operator.
apiVersion: v1
kind: Secret
metadata:
  name: incendios-secrets
  namespace: incendios
type: Opaque
stringData:
  DATABASE_URL: "postgresql://incendios:CAMBIAR@postgres:5432/incendios"
  REDIS_URL: "redis://:CAMBIAR@redis:6379/0"
  POSTGRES_PASSWORD: "CAMBIAR"
  REDIS_PASSWORD: "CAMBIAR"
  JWT_SECRET: "CAMBIAR"
  INTERNAL_API_KEY: "CAMBIAR"
  ADMIN_PASSWORD: "CAMBIAR"
  ANALISTA_PASSWORD: "CAMBIAR"
