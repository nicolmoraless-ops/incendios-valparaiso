# ---------------- Servicio IA (inferencia) ----------------
apiVersion: apps/v1
kind: Deployment
metadata: { name: ia, namespace: incendios }
spec:
  replicas: 2
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: ia } }
  template:
    metadata:
      labels: { app: ia }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8001" }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      topologySpreadConstraints:
        - { maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: ScheduleAnyway, labelSelector: { matchLabels: { app: ia } } }
      containers:
        - name: ia
          image: incendios/ia:1.0.0
          ports: [{ containerPort: 8001 }]
          env:
            - name: INTERNAL_API_KEY
              valueFrom: { secretKeyRef: { name: incendios-secrets, key: INTERNAL_API_KEY } }
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          readinessProbe: { httpGet: { path: /health, port: 8001 }, initialDelaySeconds: 5, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: 8001 }, initialDelaySeconds: 15, periodSeconds: 10, failureThreshold: 3 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: ia, namespace: incendios }
spec:
  selector: { app: ia }
  ports: [{ port: 8001 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: ia, namespace: incendios }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: ia }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - { type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } } }
---
# ---------------- API Gateway ----------------
apiVersion: apps/v1
kind: Deployment
metadata: { name: api, namespace: incendios }
spec:
  replicas: 3
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: api } }
  template:
    metadata:
      labels: { app: api }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8000" }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      topologySpreadConstraints:
        - { maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: ScheduleAnyway, labelSelector: { matchLabels: { app: api } } }
      containers:
        - name: api
          image: incendios/api:1.0.0
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: incendios-config }
            - secretRef: { name: incendios-secrets }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe: { httpGet: { path: /ready, port: 8000 }, initialDelaySeconds: 5, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 10, periodSeconds: 10, failureThreshold: 3 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: api, namespace: incendios }
spec:
  selector: { app: api }
  ports: [{ port: 8000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: api, namespace: incendios }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api }
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - { type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: api, namespace: incendios }
spec:
  minAvailable: 2
  selector: { matchLabels: { app: api } }
---
# ---------------- Worker de alertas (Event-Driven) ----------------
apiVersion: apps/v1
kind: Deployment
metadata: { name: worker, namespace: incendios }
spec:
  replicas: 2
  selector: { matchLabels: { app: worker } }
  template:
    metadata:
      labels: { app: worker }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "9101" }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: worker
          image: incendios/worker:1.0.0
          envFrom: [{ secretRef: { name: incendios-secrets } }]
          ports: [{ containerPort: 9101 }]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 250m, memory: 256Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
---
apiVersion: v1
kind: Service
metadata: { name: worker, namespace: incendios }
spec:
  selector: { app: worker }
  ports: [{ port: 9101 }]
---
# ---------------- Frontend (mapa) ----------------
apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend, namespace: incendios }
spec:
  replicas: 2
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
        - name: frontend
          image: incendios/frontend:1.0.0
          ports: [{ containerPort: 8080 }]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
          readinessProbe: { httpGet: { path: /, port: 8080 }, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: frontend, namespace: incendios }
spec:
  selector: { app: frontend }
  ports: [{ port: 80, targetPort: 8080 }]
