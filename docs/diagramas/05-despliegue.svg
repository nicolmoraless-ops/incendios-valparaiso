<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; }
    .tit { font-size: 20px; font-weight: 700; fill: #222; }
    .h { font-size: 13px; font-weight: 700; }
    .n { font-size: 12.5px; font-weight: 700; fill: #fff; text-anchor: middle; }
    .k { font-size: 10.5px; fill: #f2f2f2; text-anchor: middle; }
    .l { font-size: 11px; fill: #333; paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round; }
    .c { stroke: #555; stroke-width: 1.5; fill: none; marker-end: url(#a); }
    .cd { stroke: #555; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; marker-end: url(#a); }
    .aws { fill: #232F3E; } .net { fill: #8C4FFF; } .cmp { fill: #ED7100; } .db { fill: #3B48CC; } .sec { fill: #DD344C; } .mon { fill: #E7157B; } .s3 { fill: #3F8624; }
    .pod { fill: #438DD5; }
  </style>
  <rect width="1400" height="860" fill="#fff"/>
  <text x="24" y="34" class="tit">Despliegue en AWS (sa-east-1) · EKS multi-AZ, ALB y datos administrados</text>

  <!-- Usuarios y borde -->
  <rect x="20" y="70" width="140" height="56" rx="8" fill="#08427B"/><text x="90" y="95" class="n">Usuarios</text><text x="90" y="112" class="k">HTTPS 443</text>
  <rect x="200" y="70" width="150" height="56" rx="8" class="net"/><text x="275" y="95" class="n">Route 53</text><text x="275" y="112" class="k">DNS + health checks</text>
  <rect x="390" y="70" width="170" height="56" rx="8" class="sec"/><text x="475" y="95" class="n">AWS WAF + ACM</text><text x="475" y="112" class="k">reglas OWASP · TLS 1.2+</text>
  <path class="c" d="M160,98 L200,98"/><path class="c" d="M350,98 L390,98"/>

  <!-- Región / VPC -->
  <rect x="20" y="150" width="1080" height="690" rx="10" fill="none" stroke="#232F3E" stroke-width="2"/>
  <text x="34" y="172" class="h" fill="#232F3E">Región AWS sa-east-1 (São Paulo)</text>
  <rect x="40" y="185" width="1040" height="640" rx="8" fill="none" stroke="#8C4FFF" stroke-width="2"/>
  <text x="54" y="205" class="h" fill="#8C4FFF">VPC 10.0.0.0/16</text>

  <!-- AZ columns -->
  <rect x="60" y="215" width="490" height="595" rx="8" fill="#f7f7fb" stroke="#999" stroke-dasharray="8 5"/>
  <text x="74" y="236" class="h" fill="#555">Zona de disponibilidad sa-east-1a</text>
  <rect x="570" y="215" width="490" height="595" rx="8" fill="#f7f7fb" stroke="#999" stroke-dasharray="8 5"/>
  <text x="584" y="236" class="h" fill="#555">Zona de disponibilidad sa-east-1b</text>

  <!-- Subred pública -->
  <rect x="75" y="250" width="460" height="95" rx="6" fill="#e9f5e9" stroke="#3F8624"/>
  <text x="85" y="268" class="h" fill="#3F8624">Subred pública 10.0.0.0/24</text>
  <rect x="585" y="250" width="460" height="95" rx="6" fill="#e9f5e9" stroke="#3F8624"/>
  <text x="595" y="268" class="h" fill="#3F8624">Subred pública 10.0.1.0/24</text>
  <rect x="200" y="280" width="720" height="50" rx="8" class="net"/>
  <text x="560" y="301" class="n">Application Load Balancer (multi-AZ) · listener 443 · least outstanding requests</text>
  <text x="560" y="318" class="k">health check HTTP /ready cada 10 s · 2 OK = sano · 3 fallos = fuera · stickiness desactivada</text>
  <rect x="85" y="285" width="100" height="40" rx="6" class="net"/><text x="135" y="310" class="n">NAT GW</text>
  <rect x="935" y="285" width="100" height="40" rx="6" class="net"/><text x="985" y="310" class="n">NAT GW</text>

  <!-- Subred privada app -->
  <rect x="75" y="360" width="460" height="250" rx="6" fill="#eef4fb" stroke="#438DD5"/>
  <text x="85" y="378" class="h" fill="#1168BD">Subred privada app 10.0.10.0/24 · nodo EKS t3.large</text>
  <rect x="585" y="360" width="460" height="250" rx="6" fill="#eef4fb" stroke="#438DD5"/>
  <text x="595" y="378" class="h" fill="#1168BD">Subred privada app 10.0.11.0/24 · nodo EKS t3.large</text>

  <rect x="90" y="392" width="135" height="42" rx="6" class="pod"/><text x="157" y="410" class="n">api ×2</text><text x="157" y="425" class="k">250m · 256Mi</text>
  <rect x="235" y="392" width="135" height="42" rx="6" class="pod"/><text x="302" y="410" class="n">worker ×1</text><text x="302" y="425" class="k">100m · 128Mi</text>
  <rect x="380" y="392" width="140" height="42" rx="6" class="pod"/><text x="450" y="410" class="n">frontend ×1</text><text x="450" y="425" class="k">50m · 64Mi</text>
  <rect x="90" y="445" width="210" height="42" rx="6" class="mon"/><text x="195" y="463" class="n">Prometheus + Grafana</text><text x="195" y="478" class="k">PVC gp3 20 GB</text>
  <rect x="310" y="445" width="210" height="42" rx="6" fill="#555"/><text x="415" y="463" class="n">AWS LB Controller</text><text x="415" y="478" class="k">crea/actualiza el ALB</text>
  <rect x="90" y="500" width="430" height="95" rx="6" fill="#fff" stroke="#ED7100" stroke-width="2"/>
  <text x="100" y="518" class="h" fill="#ED7100">Node group "ia" (taint ia=true) · t3.large</text>
  <rect x="100" y="530" width="200" height="50" rx="6" class="pod"/><text x="200" y="551" class="n">ia ×1 (HPA 2–6)</text><text x="200" y="567" class="k">500m–1 CPU · 512Mi–1Gi</text>
  <text x="310" y="550" font-size="11" fill="#444">Reemplazable por g4dn.xlarge</text>
  <text x="310" y="566" font-size="11" fill="#444">si se adopta un modelo profundo</text>

  <rect x="600" y="392" width="135" height="42" rx="6" class="pod"/><text x="667" y="410" class="n">api ×1–8</text><text x="667" y="425" class="k">HPA CPU 70 %</text>
  <rect x="745" y="392" width="135" height="42" rx="6" class="pod"/><text x="812" y="410" class="n">worker ×1</text><text x="812" y="425" class="k">consumer group</text>
  <rect x="890" y="392" width="140" height="42" rx="6" class="pod"/><text x="960" y="410" class="n">frontend ×1</text><text x="960" y="425" class="k">nginx-unprivileged</text>
  <rect x="600" y="500" width="430" height="95" rx="6" fill="#fff" stroke="#ED7100" stroke-width="2"/>
  <text x="610" y="518" class="h" fill="#ED7100">Node group "ia" · Cluster Autoscaler 1–3 nodos</text>
  <rect x="610" y="530" width="200" height="50" rx="6" class="pod"/><text x="710" y="551" class="n">ia ×1 (HPA 2–6)</text><text x="710" y="567" class="k">topologySpread por zona</text>
  <text x="820" y="550" font-size="11" fill="#444">PDB api minAvailable 2</text>
  <text x="820" y="566" font-size="11" fill="#444">RollingUpdate maxUnavailable 0</text>

  <!-- Subred privada datos -->
  <rect x="75" y="625" width="460" height="170" rx="6" fill="#eef0fb" stroke="#3B48CC"/>
  <text x="85" y="643" class="h" fill="#3B48CC">Subred privada datos 10.0.20.0/24</text>
  <rect x="585" y="625" width="460" height="170" rx="6" fill="#eef0fb" stroke="#3B48CC"/>
  <text x="595" y="643" class="h" fill="#3B48CC">Subred privada datos 10.0.21.0/24</text>
  <rect x="100" y="660" width="260" height="55" rx="6" class="db"/><text x="230" y="683" class="n">RDS PostgreSQL 16 + PostGIS</text><text x="230" y="700" class="k">PRIMARIA · db.t4g.medium · gp3 50 GB · KMS</text>
  <rect x="610" y="660" width="260" height="55" rx="6" class="db" opacity=".8"/><text x="740" y="683" class="n">RDS standby (Multi-AZ)</text><text x="740" y="700" class="k">replicación síncrona · failover automático</text>
  <rect x="100" y="728" width="260" height="55" rx="6" class="db"/><text x="230" y="751" class="n">ElastiCache Redis 7</text><text x="230" y="768" class="k">primario · cache.t4g.small · TLS + AUTH</text>
  <rect x="610" y="728" width="260" height="55" rx="6" class="db" opacity=".8"/><text x="740" y="751" class="n">ElastiCache réplica</text><text x="740" y="768" class="k">Multi-AZ · failover automático</text>
  <path class="c" d="M360,687 L610,687"/><text x="440" y="680" class="l">sync</text>
  <path class="c" d="M360,755 L610,755"/><text x="440" y="748" class="l">replicación</text>

  <!-- Servicios regionales -->
  <text x="1120" y="172" class="h" fill="#232F3E">Servicios regionales</text>
  <rect x="1120" y="185" width="260" height="56" rx="8" class="cmp"/><text x="1250" y="208" class="n">Amazon EKS (control plane)</text><text x="1250" y="225" class="k">administrado · multi-AZ</text>
  <rect x="1120" y="255" width="260" height="56" rx="8" class="cmp"/><text x="1250" y="278" class="n">Amazon ECR</text><text x="1250" y="295" class="k">imágenes + escaneo de vulnerabilidades</text>
  <rect x="1120" y="325" width="260" height="56" rx="8" class="sec"/><text x="1250" y="348" class="n">Secrets Manager + KMS</text><text x="1250" y="365" class="k">External Secrets → K8s Secret</text>
  <rect x="1120" y="395" width="260" height="56" rx="8" class="sec"/><text x="1250" y="418" class="n">IAM (IRSA)</text><text x="1250" y="435" class="k">mínimo privilegio por ServiceAccount</text>
  <rect x="1120" y="465" width="260" height="56" rx="8" class="mon"/><text x="1250" y="488" class="n">CloudWatch Logs / Alarms</text><text x="1250" y="505" class="k">Fluent Bit · retención 30 días</text>
  <rect x="1120" y="535" width="260" height="56" rx="8" class="s3"/><text x="1250" y="558" class="n">Amazon S3</text><text x="1250" y="575" class="k">snapshots exportados · artefactos modelo</text>
  <rect x="1120" y="605" width="260" height="56" rx="8" class="s3"/><text x="1250" y="628" class="n">AWS Backup</text><text x="1250" y="645" class="k">copia diaria a us-east-1 (DR)</text>
  <rect x="1120" y="675" width="260" height="56" rx="8" class="ex" fill="#8C8C8C"/><text x="1250" y="698" class="n">Open-Meteo (Internet)</text><text x="1250" y="715" class="k">salida vía NAT Gateway</text>

  <!-- Flujos -->
  <path class="c" d="M475,126 L520,280"/>
  <path class="c" d="M400,330 L300,392"/>
  <path class="c" d="M720,330 L667,392"/>
