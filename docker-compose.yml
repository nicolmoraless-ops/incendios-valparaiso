# Entorno completo en una VM o equipo local:  docker compose up -d --build
# Frontend + API: http://localhost:8080 · Grafana: http://localhost:3000 · Prometheus: http://localhost:9090

x-api: &api
  build: ./services/api
  environment:
    DATABASE_URL: postgresql://incendios:${POSTGRES_PASSWORD}@db:5432/incendios
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    IA_URL: http://ia:8001
    JWT_SECRET: ${JWT_SECRET}
    INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ANALISTA_PASSWORD: ${ANALISTA_PASSWORD}
    CLIMA_CACHE_TTL: "600"
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }
    ia: { condition: service_healthy }
  networks: [backend]
  restart: unless-stopped
  deploy:
    resources:
      limits: { cpus: "0.50", memory: 256M }

services:
  lb:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy-api.conf:/etc/nginx/proxy-api.conf:ro
      - ./nginx/security-headers.conf:/etc/nginx/security-headers.conf:ro
      - ./services/frontend:/usr/share/nginx/html:ro
    depends_on: [api-1, api-2]
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/nginx-health"]
      interval: 15s

  api-1:
    <<: *api
    environment:
      DATABASE_URL: postgresql://incendios:${POSTGRES_PASSWORD}@db:5432/incendios
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      IA_URL: http://ia:8001
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ANALISTA_PASSWORD: ${ANALISTA_PASSWORD}
      INSTANCIA: api-1

  api-2:
    <<: *api
    environment:
      DATABASE_URL: postgresql://incendios:${POSTGRES_PASSWORD}@db:5432/incendios
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      IA_URL: http://ia:8001
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ANALISTA_PASSWORD: ${ANALISTA_PASSWORD}
      INSTANCIA: api-2

  ia:
    build: ./services/ia
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    networks: [backend]
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  worker:
    build: ./services/worker
    environment:
      DATABASE_URL: postgresql://incendios:${POSTGRES_PASSWORD}@db:5432/incendios
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [backend]
    restart: unless-stopped

  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: incendios
      POSTGRES_USER: incendios
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incendios -d incendios"]
      interval: 5s
      retries: 20
    networks: [backend]
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes: [redisdata:/data]
    networks: [backend]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alertas.yml:/etc/prometheus/alertas.yml:ro
    ports: ["9090:9090"]
    networks: [backend]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
    networks: [backend]
    restart: unless-stopped

networks:
  backend: {}

volumes:
  pgdata: {}
  redisdata: {}
